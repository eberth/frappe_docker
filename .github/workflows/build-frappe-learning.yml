name: Build Frappe Learning

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "images/layered/Containerfile"
      - ".github/workflows/build-frappe-learning.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create apps.json
        run: |
          cat > apps.json <<'EOF'
          [
            {
              "url": "https://github.com/frappe/payments.git",
              "branch": "develop"
            },
            {
              "url": "https://github.com/frappe/lms.git",
              "branch": "develop"
            }
          ]
          EOF

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          tags: |
            ghcr.io/eberth/frappe-learning:latest
          build-args: |
            FRAPPE_BRANCH=version-16
          secret-files: |
            apps_json=./apps.json
